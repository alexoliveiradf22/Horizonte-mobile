<script>
/* Mesmo servidor e mesmo formato de dados do app "horizonte de saldos" */
const API_URL='https://script.google.com/macros/s/AKfycbzm_IxeTW-9uH_cOLDb1StVOSBeVPIx3fcluzTbXsYddx4SH3iH4qT1_NDN77s70OLl/exec';
const CATS=[["entrada","entradas","entrada","salário, comissão, vales","↙",1,"e"],["saida","saídas","saída","gastos fixos, boletos, aluguel","↗",-1,"s"],["diario","diários","diário","gastos variáveis, compras","D",-1,"d"],["economia","economias","economia","reserva, investimento","E",-1,"ec"],["cartao","gastos com cartão","gasto com cartão","gastos ou total da fatura","C",-1,"c"]].map(a=>({k:a[0],pl:a[1],sg:a[2],ds:a[3],ic:a[4],sign:a[5],v:a[6]}));
const CK=Object.fromEntries(CATS.map((c,i)=>[c.k,i]));
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],AB=MESES.map(m=>m.slice(0,3));
const REP={nao:'não repete',mensal:'mensalmente',semanal:'semanalmente',diario:'diariamente',parcelado:'parcelado'};
const TC={cinza:'#e0e0e3',azul:'#bddffc',amarelo:'#f1f0b4',verde:'#aee995',vermelho:'#ffb5b5',roxo:'#d0bdf5',rosa:'#ffcfdc',marrom:'#e8d6c2'};
const CALC=[['s','saldos'],['p','performance'],['e','economizado'],['c','custo de vida'],['d','diário médio']];
let S={items:[],cards:[],profile:{nome:'',sobrenome:''},prev:{itens:[],div:30},tags:['mercado','casa','transporte','lazer','saúde','contas']};
try{const r=localStorage.getItem('horizonte.v1');if(r)Object.assign(S,JSON.parse(r))}catch(e){}
S.tags=S.tags.map(t=>typeof t==='string'?{n:t,c:'cinza'}:t);
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c,12)},esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const brl=v=>{v=Math.round(v*100)/100;return 'R$ '+(v<0?'-':'')+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
const fmtV=v=>(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const maskMoney=el=>{const d=el.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,12),t=d?fmtV(parseInt(d,10)/100):'';el.value=t;return t};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=key(new Date()),hoje=new Date();
const dim=(y,m)=>new Date(y,m+1,0).getDate();
/* ---------- servidor ---------- */
let TOKEN=null,ACC=null,ONLINE=!!API_URL,pt=null,pending=false,AM='entrar';
try{TOKEN=localStorage.getItem('horizonte.token')}catch(e){}
const setTok=t=>{TOKEN=t;try{t?localStorage.setItem('horizonte.token',t):localStorage.removeItem('horizonte.token')}catch(e){}};
async function api(action,p){try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,...p})});return await r.json()}catch(e){return{ok:false,erro:'sem conexão com o servidor',off:1}}}
function pushRemote(){if(!ONLINE||!TOKEN)return;pending=true;clearTimeout(pt);pt=setTimeout(async()=>{const r=await api('save',{token:TOKEN,data:JSON.stringify(S)});pending=false;if(r&&r.erro==='sessao')doLogout('sessão expirada. entre novamente');else if(r&&!r.ok)toast('não foi possível sincronizar')},700)}
const save=()=>{try{localStorage.setItem('horizonte.v1',JSON.stringify(S))}catch(e){}pushRemote()};
function applyRemote(r){ACC=r.perfil;if(r.data){try{Object.assign(S,JSON.parse(r.data))}catch(e){}}S.tags=S.tags.map(t=>typeof t==='string'?{n:t,c:'cinza'}:t);S.profile={nome:ACC.nome||'',sobrenome:ACC.sobrenome||''};applyTheme()}
async function bootRemote(){
 if(!API_URL){enterApp();return}showAuth('carregando');
 if(TOKEN){const r=await api('load',{token:TOKEN});if(r.ok){applyRemote(r);hideAuth();enterApp();return}if(r.off){offline();return}setTok(null)}
 const st=await api('status',{});if(st.off){offline();return}showAuth(st.hasAccount?'entrar':'cadastrar')}
function offline(){ONLINE=false;hideAuth();toast('sem acesso ao servidor: modo local, sem sincronizar');enterApp()}
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&ONLINE&&TOKEN&&!pending){const r=await api('load',{token:TOKEN});if(r.ok){applyRemote(r);render()}}});
function doLogout(msg){setTok(null);ACC=null;closeS();showAuth('entrar');if(msg)toast(msg)}
function showAuth(m){AM=m;$('#auth').style.display='flex';renderAuth()}const hideAuth=()=>{$('#auth').style.display='none'};
function renderAuth(){if(AM=='carregando'){$('#acard').innerHTML='<h2>conectando…</h2>';return}const c=AM=='cadastrar';
 $('#acard').innerHTML=`<h2>${c?'criar conta':'entrar'}</h2>${c?'<input id="anome" placeholder="nome"><input id="asob" placeholder="sobrenome">':''}<input id="aem" type="email" placeholder="email" autocomplete="username"><input id="ase" type="password" placeholder="senha" autocomplete="${c?'new-password':'current-password'}">${c?'<input id="ase2" type="password" placeholder="repetir senha">':''}<button class="btn" onclick="${c?'aReg()':'aLogin()'}">${c?'cadastrar':'entrar'}</button><button class="btn g" onclick="AM='${c?'entrar':'cadastrar'}';renderAuth()">${c?'já tem conta? entrar':'não tem conta? cadastrar'}</button>`}
async function aLogin(){const r=await api('login',{email:$('#aem').value.trim().toLowerCase(),senha:$('#ase').value});if(!r.ok){toast(r.erro||'não foi possível entrar');return}setTok(r.token);applyRemote(r);hideAuth();enterApp()}
async function aReg(){const em=$('#aem').value.trim().toLowerCase(),pw=$('#ase').value;if(!/^\S+@\S+\.\S+$/.test(em))return toast('digite um email válido');if(pw.length<6)return toast('use ao menos 6 caracteres na senha');if(pw!==$('#ase2').value)return toast('as senhas não conferem');const nome=$('#anome').value.trim();if(!nome)return toast('informe seu nome');
 const r=await api('register',{email:em,senha:pw,nome,sobrenome:$('#asob').value.trim()});if(!r.ok){toast(r.erro||'erro ao cadastrar');return}setTok(r.token);applyRemote(r);save();hideAuth();enterApp()}
function enterApp(){if(S.delAt){if(Date.now()>=S.delAt){wipe();return}S.delAt=0;save();toast('exclusão da conta cancelada')}stack=[];tab='saldos';pend=true;render()}
async function wipe(){if(ONLINE&&TOKEN){const r=await api('delete',{token:TOKEN});if(!r.ok){toast(r.erro||'erro ao apagar a conta');return}}try{localStorage.removeItem('horizonte.v1')}catch(e){}setTok(null);S={items:[],cards:[],profile:{nome:'',sobrenome:''},prev:{itens:[],div:30},tags:[]};showAuth('cadastrar')}
/* ---------- motor (igual ao app web) ---------- */
function addP(d0,k,t){if(t==='mensal'||t==='parcelado'){const tot=d0.getFullYear()*12+d0.getMonth()+k,ny=Math.floor(tot/12),nm=tot%12;return new Date(ny,nm,Math.min(d0.getDate(),dim(ny,nm)),12)}return new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+k*(t==='semanal'?7:1),12)}
function occCount(it){const t=it.rep||'nao';return t==='nao'?1:t==='parcelado'?Math.max(1,it.parcelas|0):it.ate==='vezes'?Math.max(1,it.vezes|0):Infinity}
const isSeries=it=>occCount(it)>1;
function exSet(it){const o=[];(it.tags||[]).forEach(n=>{const g=S.tags.find(x=>x.n===n);if(g&&g.calc)CALC.forEach(([m])=>{if(g.calc[m]===false&&!o.includes(m))o.push(m)})});return o}
const prevDia=()=>S.prev.itens.reduce((a,g)=>a+g.v,0)/(S.prev.div||30);
let DAY={},LIST={},PRE=0,FCD={},XD={},SAL={};
function compute(st){const endK=key(new Date(st.getFullYear(),st.getMonth()+12,0,12)),sk=key(st);DAY={};LIST={};PRE=0;FCD={};XD={};
 S.items.forEach(it=>{const t=it.rep||'nao',d0=parse(it.date),n=occCount(it),nn=n===Infinity?1e5:n,v0=t==='parcelado'?it.value/nn:it.value;

function pAte(){sheet(phd('até quando')+[['infinito','a perder de vista'],['vezes','número de repetições']].map(([k,l])=>`<div class="li" onclick="F.ate='${k}';closeP();renderForm()"><b>${l}</b><span>${F.ate===k?'✓':''}</span></div>`).join(''))}
const togTagI=i=>togTag(S.tags[i].n);
function tgl(){const q=TQ2.toLowerCase();return S.tags.map((g,i)=>[g,i]).filter(([g])=>g.n.toLowerCase().includes(q)).map(([g,i])=>`<div class="li" onclick="togTagI(${i});$('#tgl').innerHTML=tgl()"><span><i class="tg" style="background:${TC[g.c]||TC.cinza}"></i><b>${esc(g.n)}</b></span><span class="cbx ${F.tags.includes(g.n)?'on':''}">${F.tags.includes(g.n)?'✓':''}</span></div>`).join('')||'<div class="li"><small>nenhuma tag. crie na aba tags.</small></div>'}
function pTags(){TQ2='';sheet(phd('tags')+`<div class="pd"><input placeholder="filtrar tags" oninput="TQ2=this.value;$('#tgl').innerHTML=tgl()"></div><div id="tgl">${tgl()}</div><div class="pd"><button class="btn" onclick="closeP();renderForm()">salvar</button></div>`)}
function togTag(n){const i=F.tags.indexOf(n);i>-1?F.tags.splice(i,1):F.tags.push(n)}
function saveItem(){const v=parseFloat(String(F.v).replace(/\./g,'').replace(',','.'));if(!(v>0))return toast('informe o valor');
 const cardOn=F.cat===4&&F.card&&cardOf(F.card)&&F.venc;
 if(F.id){const f={value:Math.round(v*100)/100,cat:CATS[F.cat].k,desc:F.desc.trim(),tags:[...F.tags],date:cardOn?F.venc:F.date,compra:cardOn?F.date:'',card:cardOn?F.card:null},it=S.items.find(x=>x.id===F.id),k=F.occK;if(!it)return closeS();
  const fin=m=>{applyEdit(it,k,m,f);save();closeS();render()};if(isSeries(it)&&it.rep!=='parcelado'){choice('atualizar repetições',[['one','somente esta'],['next','esta e as próximas'],...(k>0?[['all','todas']]:[])],fin);return}fin('all');return}
 const p=F.rep==='parcelado'?Math.max(2,Math.min(600,+F.parcelas||2)):0;
 S.items.push({id:uid(),created:Date.now(),date:cardOn?F.venc:F.date,compra:cardOn?F.date:'',card:cardOn?F.card:null,cat:CATS[F.cat].k,desc:F.desc.trim(),value:Math.round(v*100)/100,tags:F.tags,rep:F.rep,parcelas:p,ate:F.rep==='nao'||F.rep==='parcelado'?'infinito':F.ate,vezes:Math.max(2,Math.min(600,+F.vezes||2))});save();closeS();render()}
function choice(t,opts,fn){CBF=fn;sheet(`<div class="hd"><span>${t}</span>${xb}</div><div class="pd">${opts.map(([k,l])=>`<button class="btn ${t.startsWith('apagar')?'o':''}" onclick="pick('${k}')">${l}</button>`).join('')}</div>`,1)}
const pick=k=>{const f=CBF;CBF=null;closeP();if(f)f(k)};
function askDel(){const it=S.items.find(x=>x.id===F.id),k=F.occK;if(!it)return;const done=()=>{save();closeS();render()};
 if(isSeries(it))choice('apagar repetições',[['one','somente esta'],['next','esta e as próximas'],['all','todas']],m=>{delOcc(it,k,m);done()});else confirmS('apagar movimentação','essa ação não poderá ser desfeita.','apagar',()=>{S.items=S.items.filter(x=>x!==it);done()})}
function confirmS(t,m,b,fn){CBF=fn;sheet(`<b style="font-size:20px">${t}</b><p style="color:var(--mut)">${m}</p><button class="btn o" onclick="const f=CBF;CBF=null;closeP();f()">${b}</button><button class="btn g" onclick="closeP()">cancelar</button>`,1)}
function totais(){const ym=Y+'-'+pad(M+1),t=monthSum(ym),pd=prevDia(),dias=dim(Y,M),hj=Y===hoje.getFullYear()&&M===hoje.getMonth(),el=hj?hoje.getDate():dias;let rest=0,pv=0;Object.keys(FCD).forEach(k=>{if(k.slice(0,7)===ym){rest++;pv+=FCD[k]}});
 const tp=monthSum(ym,'p'),te=monthSum(ym,'e'),tc=monthSum(ym,'c'),td=monthSum(ym,'d'),perf=tp[0]-tp[1]-tp[2]-tp[3]-tp[4]-pv,custo=tc[1]+tc[2]+tc[4]+pv,eco=te[0]>0?te[3]/te[0]*100:0,P='<span class="dot pv">D</span>';
 return`<div class="sec">cálculos do mês</div>
 <div class="calc"><div><b>performance</b><div class="ics">${dot(0)}–${dot(1)}–${dot(2)}–${dot(3)}–${dot(4)}–${P}</div></div><div class="rr"><b style="color:${perf<0?'var(--s)':'var(--e)'}">${brl(perf)}</b><small>${perf<0?'faltou dinheiro':'sobrou dinheiro'}</small></div></div>
 <div class="calc"><div><b>economizado</b><div class="ics">${dot(3)}<span class="bar2"><i style="width:${Math.min(100,Math.max(0,eco))}%"></i></span>${dot(0)}</div></div><div class="rr"><b>${(+eco.toFixed(2)).toString().replace('.',',')}%</b><small>${eco>0?'guardado':'nada guardado'}</small></div></div>
 <div class="calc"><div><b>custo de vida</b><div class="ics">${dot(1)}+${dot(2)}+${dot(4)}+${P}</div></div><div class="rr"><b>${brl(custo)}</b><small>${custo>t[0]?'acima da renda':'dentro da renda'}</small></div></div>
 <div class="calc"><div><b>diário médio</b><div class="ics">${dot(2)}/ ${el}</div></div><div class="rr"><b>${brl(td[2]/el)}</b><div class="ics">${P} ${brl(pd)}</div></div></div>
 <div class="sec" style="margin-top:50px">movimentações do mês</div>`+CATS.map((c,i)=>`<div class="li" onclick="FILT=${i};setTab('saldos')"><span>${dot(i)}<b>${c.pl}</b></span><span>${brl(t[i])}</span></div>`).join('')+
 `<div class="li" onclick="FILT='todas';setTab('saldos')"><span>${TODAS}<b>ver todas</b></span></div><div class="sec" style="margin-top:50px">previsão de diários do mês</div><div class="li" onclick="go({fn:prevDiario})"><span>${P}<b>previsão de diário <span style="font-weight:400">x ${rest}</span></b></span><span>${brl(pv)}</span></div>`}
let EDT=false,TQ='';
function tags(){return`<div class="sec" style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px 8px 24px">tags<span><button class="ic" style="font-size:22px" onclick="EDT=!EDT;render()">✎</button><button class="ic" style="font-size:22px" onclick="tagForm()">⊕</button></span></div><div class="pd" style="border-bottom:1px solid var(--line)"><input placeholder="🔍 filtrar tags" value="${esc(TQ)}" oninput="TQ=this.value;$('#tl').innerHTML=tl()"></div><div id="tl">${tl()}</div>`}
function tl(){const ym=Y+'-'+pad(M+1),sums={};Object.keys(LIST).forEach(kc=>{if(kc.slice(0,7)!==ym)return;LIST[kc].forEach(o=>(o.it.tags||[]).forEach(g=>sums[g]=(sums[g]||0)+o.v))});
 return S.tags.filter(g=>g.n.toLowerCase().includes(TQ.toLowerCase())).sort((a,b)=>a.n.localeCompare(b.n,'pt-BR')).map((g,i)=>`<div class="li tl" onclick="tagForm(${S.tags.indexOf(g)})"><span><span class="tg" style="background:${TC[g.c]||TC.cinza}"></span><b>${esc(g.n)}</b></span>${EDT?`<button class="ic" style="font-size:20px;color:#e05555" onclick="event.stopPropagation();delTag(${S.tags.indexOf(g)})">🗑</button>`:`<span>${brl(sums[g.n]||0)}</span>`}</div>`).join('')||'<div class="empty" style="margin-top:12vh;font-size:16px">nenhuma tag.</div>'}
function delTag(i){const g=S.tags[i];confirmS('apagar tag','apenas a tag será removida. as movimentações continuam registradas.','apagar',()=>{S.items.forEach(it=>{it.tags=(it.tags||[]).filter(x=>x!==g.n)});S.tags.splice(i,1);save();render()})}
let NT=null;
function tagForm(i){const g=i!=null?S.tags[i]:null;NT={i,n:g?g.n:'',c:g?g.c:'verde',calc:{s:1,p:1,e:1,c:1,d:1,...Object.fromEntries(Object.entries((g&&g.calc)||{}).map(([k,v])=>[k,v?1:0]))}};tagSheet()}
function tagSheet(){sheet(`<div class="hd"><span>${NT.i!=null?'editar':'criar'} tag</span>${xb}</div><div class="pd"><input maxlength="24" placeholder="nome" value="${esc(NT.n)}" oninput="NT.n=this.value"><div style="color:var(--mut);padding:14px 0 4px">cor de fundo</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${Object.keys(TC).map(k=>`<button style="background:${TC[k]};border:1px solid var(--line);border-radius:10px;padding:12px;color:#222;${k===NT.c?'outline:2px solid #222':''}" onclick="NT.c='${k}';tagSheet()">${k}</button>`).join('')}</div><div style="color:var(--mut);padding:16px 0 0">calcular em</div>${CALC.map(([k,l])=>`<label class="li" style="padding:10px 0"><span>${l}</span><input type="checkbox" ${NT.calc[k]?'checked':''} onchange="NT.calc['${k}']=this.checked?1:0"></label>`).join('')}<button class="btn" onclick="saveTag()">salvar</button></div>`)}
function saveTag(){const n=NT.n.trim();if(!n)return toast('informe o nome');const calc=Object.fromEntries(Object.entries(NT.calc).map(([k,v])=>[k,!!v]));
 if(NT.i!=null){const g=S.tags[NT.i];S.items.forEach(it=>{it.tags=(it.tags||[]).map(x=>x===g.n?n:x)});Object.assign(g,{n,c:NT.c,calc})}else if(!S.tags.some(t=>t.n.toLowerCase()===n.toLowerCase()))S.tags.push({n,c:NT.c,calc});save();closeS();render()}
function menu(){const p=S.profile,em=ACC?ACC.email:'';return`<div style="padding:34px 24px 20px"><div style="font-size:26px;font-weight:700">${esc(p.nome||'usuário')} ${esc(p.sobrenome)}</div><div style="color:var(--mut)">${esc(em)}</div><span class="chip">✓ ${ONLINE?'sincronizado com o servidor':'modo local'}</span></div>`+[['editar perfil','perfil'],['previsão de diário','prevDiario'],['cartões de crédito','cartoes'],['configurações','config']].map(a=>`<div class="li" onclick="go({fn:${a[1]}})"><span>${a[0]}</span><span style="color:var(--mut)">›</span></div>`).join('')+(API_URL?'<div class="li" onclick="if(ONLINE&&TOKEN)api(\'logout\',{token:TOKEN});doLogout()"><span>sair</span></div>':'')}
const head=t=>`<div class="hd"><button class="ic" onclick="back()">←</button><span style="flex:1">${t}</span></div>`;
function perfil(){return head('perfil')+`<div class="pd"><small style="color:var(--mut)">email</small><input id="pem" value="${esc(ACC?ACC.email:'')}" ${ACC?'':'disabled'}><small style="color:var(--mut)">nome</small><input id="pn" value="${esc(S.profile.nome)}"><small style="color:var(--mut)">sobrenome</small><input id="ps" value="${esc(S.profile.sobrenome)}"><button class="btn" onclick="savePerfil()">salvar dados pessoais</button><small style="display:block;color:var(--mut);margin-top:8px">ao alterar os dados ou a senha, você sai e entra de novo.</small><div style="margin-top:26px;color:var(--mut)">alterar senha</div><input id="pw1" type="password" placeholder="nova senha"><input id="pw2" type="password" placeholder="repetir senha"><button class="btn g" style="border:1px solid var(--line)" onclick="savePw()">salvar senha</button></div>`}
async function savePerfil(){const nome=$('#pn').value.trim(),sob=$('#ps').value.trim();if(ONLINE&&TOKEN){const email=$('#pem').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return toast('digite um email válido');const r=await api('profile',{token:TOKEN,email,nome,sobrenome:sob});if(!r.ok)return toast(r.erro||'erro ao salvar');doLogout('dados alterados. entre novamente com sua conta');return}S.profile={nome,sobrenome:sob};save();back()}
async function savePw(){const a=$('#pw1').value;if(a.length<6)return toast('use ao menos 6 caracteres');if(a!==$('#pw2').value)return toast('as senhas não conferem');if(!(ONLINE&&TOKEN))return toast('precisa estar conectado ao servidor');const r=await api('password',{token:TOKEN,senha:a});if(!r.ok)return toast(r.erro||'erro ao alterar a senha');doLogout('senha alterada. entre novamente com sua conta')}
function prevDiario(){const P=S.prev,tot=P.itens.reduce((a,g)=>a+g.v,0);return`<div class="hd"><button class="ic" onclick="back()">←</button><span style="flex:1">previsão de diário</span><button class="ic" onclick="gastoForm()">＋</button></div>`+P.itens.map((g,i)=>`<div class="li" onclick="gastoForm(${i})"><b>${esc(g.d||'gasto mensal')}</b><span>${brl(g.v)}</span></div>`).join('')+`<div class="pd" style="padding-top:30px"><div class="li" style="padding:10px 0;border:0"><span>total mensal</span><span>${brl(tot)}</span></div><div class="li" style="padding:10px 0;border:0"><span>dividido por</span><select style="width:auto" onchange="S.prev.div=+this.value;save();render()">${[31,30,29,28].map(n=>`<option ${n===P.div?'selected':''} value="${n}">${n} dias</option>`).join('')}</select></div><div style="text-align:right;font-size:26px;font-weight:700;padding:20px 0">${brl(tot/P.div)}</div></div>`}
function gastoForm(i){const g=i!=null?S.prev.itens[i]:{v:'',d:''};F={gi:i,v:g.v?fmtV(g.v):'',d:g.d};sheet(`<div class="hd"><span>${i!=null?'editar':'adicionar'} gasto mensal</span>${xb}</div><div class="pd"><input inputmode="decimal" placeholder="valor 0,00" value="${esc(F.v)}" oninput="F.v=maskMoney(this)"><input placeholder="descrição" value="${esc(F.d)}" oninput="F.d=this.value"><button class="btn" onclick="saveGasto()">salvar</button>${i!=null?`<button class="btn g" style="color:#d9534f" onclick="S.prev.itens.splice(${i},1);save();closeS();render()">apagar</button>`:''}</div>`)}
function saveGasto(){const v=parseFloat(String(F.v).replace(/\./g,'').replace(',','.'));if(!(v>0))return toast('informe o valor');if(F.gi!=null){Object.assign(S.prev.itens[F.gi],{v,d:F.d.trim()})}else S.prev.itens.push({id:'g'+Date.now().toString(36),v,d:F.d.trim()});save();closeS();render()}
function cartoes(){return`<div class="hd"><button class="ic" onclick="back()">←</button><span style="flex:1">cartões</span><button class="ic" onclick="cardForm()">＋</button></div>`+S.cards.map((c,i)=>`<div class="li" onclick="cardForm(${i})"><div style="flex-direction:column;align-items:flex-start;gap:2px"><b>▭ ${esc(c.n)}</b><small>dia do fechamento · ${c.c}</small><small>dia do vencimento · ${c.v}</small></div></div>`).join('')||'<div class="empty" style="font-size:16px">nenhum cartão cadastrado</div>'}
function cardForm(i){const c=i!=null?S.cards[i]:{n:'',c:'',v:''};F={ci:i};sheet(`<div class="hd"><span>${i!=null?'editar':'adicionar'} cartão</span>${xb}</div><div class="pd"><input id="cn" placeholder="nome" value="${esc(c.n)}"><input id="cf" type="number" min="1" max="31" placeholder="dia do fechamento" value="${c.c}"><input id="cv" type="number" min="1" max="31" placeholder="dia do vencimento" value="${c.v}"><button class="btn" onclick="saveCard()">salvar</button>${i!=null?`<button class="btn g" style="color:#d9534f" onclick="S.cards.splice(${i},1);save();closeS();render()">apagar</button>`:''}</div>`)}
function saveCard(){const n=$('#cn').value.trim(),c=Math.round(+$('#cf').value),v=Math.round(+$('#cv').value);if(!n||!(c>=1&&c<=31)||!(v>=1&&v<=31))return toast('preencha o nome e os dias (de 1 a 31)');if(F.ci!=null)Object.assign(S.cards[F.ci],{n,c,v});else S.cards.push({id:'c'+Date.now().toString(36),n,c,v});save();closeS();render()}
function config(){return head('configurações')+[['aparência','apar'],['meus dados','dados']].map(a=>`<div class="li" onclick="go({fn:${a[1]}})"><span>${a[0]}</span><span style="color:var(--mut)">›</span></div>`).join('')}
function apar(){return head('aparência')+[['light','modo claro'],['dark','modo escuro'],['system','usar configuração do sistema']].map(a=>`<div class="li" onclick="S.theme='${a[0]}';save();render()"><span>${a[1]}</span><span>${(S.theme||'system')===a[0]?'✓':''}</span></div>`).join('')}
function dados(){const g='flex-direction:column;align-items:flex-start;gap:2px';return head('meus dados')+`<div class="li" onclick="zerar()"><div style="${g}"><span>↻ zerar minha conta</span><small>apaga todas as movimentações e recomeça do zero</small></div></div><div class="li" style="color:#e05a66" onclick="apagar()"><div style="${g}"><span>🗑 apagar minha conta</span><small>exclui permanentemente sua conta e seus dados</small></div></div>`}
const zerar=()=>confirmS('zerar minha conta','essa ação é irreversível: todas as movimentações e previsão de diário serão excluídas.','zerar conta',()=>{S.items=[];S.prev.itens=[];save();toast('conta zerada');render()});
const apagar=()=>confirmS('apagar minha conta','todos os seus dados serão removidos permanentemente em 30 dias. entre de novo nesse período para cancelar.','apagar conta',async()=>{S.delAt=Date.now()+30*864e5;save();if(ONLINE&&TOKEN)await api('save',{token:TOKEN,data:JSON.stringify(S)});doLogout('exclusão agendada')});
const K=v=>Math.abs(v)>=1000?Number((v/1000).toPrecision(3))+'K':String(Number(v.toPrecision(3)));
function horizonte(){const hs=new Date(hoje.getFullYear(),hoje.getMonth(),1,12);buildSal(hs);const ms=[];for(let i=0;i<12;i++){const x=new Date(hs.getFullYear(),hs.getMonth()+i,1,12);ms.push([x.getFullYear(),x.getMonth()])}
 return`<div class="hd"><button class="ic" onclick="back()">←</button><span style="flex:1">horizonte de saldos</span><button class="ic" onclick="addSheet()">＋</button></div><div class="hz">`+ms.map(([y,m],i)=>`<div class="mc"><div class="m ${i?'':'on'}">${AB[m]}/${String(y).slice(2)}</div>`+Array.from({length:31},(_,j)=>{const d=j+1;if(d>dim(y,m))return'<div class="c"><span class="x"></span><span class="x"></span></div>';const k=key(new Date(y,m,d,12)),v=SAL[k]||0,wk=[0,6].includes(new Date(y,m,d).getDay());return`<div class="c"><span class="${k===today?'hh':wk?'wk':''}">${d}</span><span style="${salBg(v)||'background:var(--sal)'}">${K(v)}</span></div>`}).join('')+'</div>').join('')+'</div>'}

var TX=0,TY=0,LX=0,LY=0,SL=0;
const SEQ=[0,1,2,3,4,'todas'];
function nextF(c,st){let i=SEQ.indexOf(c);i=st>0?(i+1)%SEQ.length:Math.max(0,i-1);return SEQ[i]}
document.addEventListener('touchstart',e=>{const t=e.touches[0];TX=LX=t.clientX;TY=LY=t.clientY},{passive:true});
document.addEventListener('touchmove',e=>{const t=e.touches[0];LX=t.clientX;LY=t.clientY},{passive:true});
function swipeEnd(e){
 if($('#ov').innerHTML||$('#fs').style.display==='block')return;
 if(!e.target||!e.target.closest||!e.target.closest('main'))return;
 const t=e.changedTouches&&e.changedTouches[0],x=t?t.clientX:LX,y=t?t.clientY:LY,dx=x-TX,dy=y-TY;
 if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;
 const v=stack[stack.length-1],st=dx>0?1:-1;
 if(v&&v.dia){const n=nextF(dfilt,st);if(n!==dfilt){dfilt=n;SL=st;render()}return}
 if(!v&&tab==='saldos'){const n=nextF(FILT,st);if(n!==FILT){FILT=n;SL=st;render()}}
}
document.addEventListener('touchend',swipeEnd,{passive:true});
document.addEventListener('touchcancel',swipeEnd,{passive:true});
applyTheme();bootRemote();
</script></body></html>
